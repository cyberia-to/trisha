# Neptune — provable blockchain powered by Triton VM
# https://neptune.cash

[os]
name = "neptune"
display_name = "Neptune"
vm = "triton"

[runtime]
binding_prefix = "os.neptune"
account_model = "utxo"
storage_model = "merkle-authenticated"
transaction_model = "proof-based"

[cross_chain]
protocols = []

[status]
level = 2
ext_modules = 5
tests = false
notes = "Kernel, authorization, arithmetic and UTXO helpers. Recursive STARK verifier and live deployment are unavailable."
