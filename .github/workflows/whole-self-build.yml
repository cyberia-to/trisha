name: Complete native compiler self-build proofs
on:
  workflow_dispatch:
    inputs:
      retain_draft:
        description: Retain verified proof chunks on the reviewed existing evidence draft
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: whole-self-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full:
    if: github.repository == 'cyberia-to/trisha' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        generation: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Build pinned native Joy and replay exact full job
        timeout-minutes: 300
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATION: ${{ matrix.generation }}
          RETAIN_DRAFT: ${{ inputs.retain_draft }}
        run: >-
          python -B scripts/whole-self-build.py
          --generation "$GENERATION"
          --results "$RUNNER_TEMP/whole-self-build-results"
      - name: Retain verified complete proof as checked draft assets
        timeout-minutes: 45
        if: success() && inputs.retain_draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B scripts/whole-self-retain.py
          --results "$RUNNER_TEMP/whole-self-build-results"
      - name: Preserve exact success or failure receipts and native executable
        timeout-minutes: 10
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whole-self-build-c${{ matrix.generation }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/whole-self-build-results/
          if-no-files-found: error
          retention-days: 30
