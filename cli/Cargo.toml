[package]
name = "trisha"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trisha"
path = "main.rs"

[features]
# The warrior CLI (run/prove/verify/deploy) IS trisha's reason to exist, so it
# builds by default; `--no-default-features` gives the light mining-only binary
# without trident and the vendored triton-vm.
default = ["triton"]
triton = ["dep:trident-lang", "dep:trisha-rs", "trisha-honeycrisp/triton"]
gpu    = ["trisha-honeycrisp/gpu"]

[dependencies]
# default-features = false drops burn/cubecl — which enables serde/rc and splits
# serde into two instances the vendored triton crates cannot share (trisha#1).
trident-lang = { path = "../../trident", optional = true, default-features = false }
trisha-rs = { path = "../rs", optional = true }
trisha-wgpu = { path = "../wgpu", optional = true }
trisha-honeycrisp = { path = "../honeycrisp" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
