[package]
name = "trisha"
version = "0.3.0"
edition = "2021"
description = "Triton warrior: compile, execute and prove Trident programs"
license-file = "../LICENSE"
repository = "https://github.com/cyberia-to/trisha"

[[bin]]
name = "trisha"
path = "main.rs"

[features]
# The warrior CLI (run/prove/verify/deploy) IS trisha's reason to exist, so it
# builds by default; `--no-default-features` gives the light mining-only binary
# without trident and the vendored triton-vm.
default = ["triton"]
triton = ["dep:trident-lang", "dep:trisha-rs", "dep:trisha-neptune", "trisha-honeycrisp/triton"]
gpu    = ["trisha-honeycrisp/gpu"]

[dependencies]
trisha-neptune = { version = "0.3.0", path = "../neptune", optional = true }
# A warrior never trains: default-features = false keeps burn/cubecl/wgpu out
# of trisha's graph entirely (build weight, not correctness — trisha#1's real
# cause was twenty-first's cdylib crate-type, patched in patches/apply.nu).
trident-lang = { version = "0.4.0", path = "../../trident", optional = true, default-features = false }
trisha-rs = { version = "0.3.0", path = "../rs", optional = true }
trisha-wgpu = { version = "0.3.0", path = "../wgpu", optional = true }
trisha-honeycrisp = { version = "0.3.0", path = "../honeycrisp" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
toml = "0.8"
bincode = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
toml = "0.8"
