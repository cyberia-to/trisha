[workspace]
members = ["cli", "rs", "wgpu", "honeycrisp"]
# resolver = "1": the vendored triton chain shares twenty-first/rand/serde between
# its build scripts and the normal graph; resolver 2 gives those two contexts
# different feature sets, which makes the SAME type from twenty-first fail to
# match itself (trisha#1). Unifying features is what this vendored stack needs.
resolver = "1"

[patch.crates-io]
triton-vm                = { path = ".vendor/triton-vm" }
twenty-first             = { path = ".vendor/twenty-first" }
triton-air               = { path = ".vendor/triton-air" }
triton-isa               = { path = ".vendor/triton-isa" }
triton-constraint-circuit = { path = ".vendor/triton-constraint-circuit" }
triton-constraint-builder = { path = ".vendor/triton-constraint-builder" }
